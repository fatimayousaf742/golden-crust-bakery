      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#ffd977"/>
      <stop offset="100%" stop-color="#f0a83c"/>
    </radialGradient>
    <linearGradient id="grainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eeb354"/>
      <stop offset="100%" stop-color="#c97f1e"/>
    </linearGradient>
    <g id="grain">
